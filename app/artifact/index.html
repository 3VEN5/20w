<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>申请进度助手 · 可用版</title>
<style>
/* 样式。一般不用改；颜色在 :root 里。 */
:root{
  --bg:#F3F5F4; --surface:#fff; --sunk:#EAEFEE; --ink:#16282A; --muted:#5B6C6D; --line:#D7E0DF;
  --accent:#2F5D62; --accent-ink:#fff; --accent-soft:#DFEBEB;
  --red:#B4372A; --red-bg:#FBE8E5; --amber:#93600F; --amber-bg:#FCF1DC; --green:#2C7448; --green-bg:#E3F2E8;
  --shadow:0 1px 2px rgba(22,40,42,.06),0 6px 18px rgba(22,40,42,.07);
  --f:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --fd:"Noto Serif SC","Songti SC",serif;
}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--fd);font-size:18px;white-space:nowrap}
.brand small{font-family:var(--f);font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.roles{margin-left:auto;display:flex;background:var(--sunk);border-radius:999px;padding:3px}
.roles button{border:0;background:none;border-radius:999px;padding:5px 14px;color:var(--muted);font-size:14px;white-space:nowrap}
.roles button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.tabs{display:flex;gap:2px;border-top:1px solid var(--line)}
.tabs button{border:0;background:none;padding:9px 14px 7px;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center}
.fake{background:var(--amber-bg);color:var(--amber);font-size:12px;text-align:center;padding:3px 8px}
main{padding-block:20px 80px}
h2{font-size:16px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2:first-child{margin-top:0}
h2 .cnt{font-size:12px;font-weight:500;background:var(--sunk);color:var(--muted);border-radius:999px;padding:0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
.card.red{border-left:4px solid var(--red)} .card.yellow{border-left:4px solid #D99A2B}
.muted{color:var(--muted)} .small{font-size:13px}
.head{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.head b{font-size:15px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.red{background:var(--red-bg);color:var(--red)} .chip.yellow{background:var(--amber-bg);color:var(--amber)} .chip.green{background:var(--green-bg);color:var(--green)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;flex:none}
.dot.red{background:var(--red)} .dot.yellow{background:#D99A2B} .dot.green{background:var(--green)}
textarea,input[type=text],input[type=date],select{display:block;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);line-height:1.6}
textarea{resize:vertical}
textarea.msg{background:#F6FBF3;min-height:128px}
textarea.note{background:#FFFDF6;min-height:190px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.btn{border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:var(--accent-ink);font-weight:700;white-space:nowrap}
.btn.ghost{background:var(--sunk);color:var(--ink);font-weight:500}
.btn:disabled{opacity:.45;cursor:default}
.empty{color:var(--muted);font-size:14px;padding:10px 2px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.upd{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.upd:first-of-type{border-top:0}
.upd > input[type=checkbox]{width:16px;height:16px;margin-top:5px;accent-color:var(--accent)}
.upd .src{grid-column:2;font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:2px 8px}
.upd.off .what{text-decoration:line-through;color:var(--muted)}
.thinking{display:flex;gap:10px;align-items:center;color:var(--muted);padding:30px 0;justify-content:center}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:b 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.25}50%{opacity:1}}
.redline{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;margin-top:10px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pills button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;display:flex;align-items:center;gap:6px}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:500}
td.nw{white-space:nowrap}
tr.pick{cursor:pointer} tr.pick:hover td{background:var(--sunk)}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 12px 18px;border-left:2px solid var(--line);margin-left:6px}
.tl li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl li.fresh::before{background:var(--accent)}
.tl .t{font-size:12.5px;color:var(--muted)}
.tl .who{font-weight:700;margin-right:6px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.tile .n{font-size:28px;font-weight:700;line-height:1.2}
.tile .l{font-size:13px;color:var(--muted)}
.report{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;margin-top:10px}
.rep-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:10px}
.rep-h b{font-family:var(--fd);font-size:17px}
.report ul{margin:2px 0 10px;padding-left:20px}
.ask{background:var(--amber-bg);color:var(--amber);border-radius:8px;padding:8px 10px;font-weight:500;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 18px;border-radius:999px;font-size:14px;z-index:20;box-shadow:var(--shadow);white-space:nowrap}
.reset{border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:0}
@media (max-width:820px){
  .two{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand small{display:none}
  .hide-m{display:none}
}

.who-me{font-size:13px;color:var(--muted);white-space:nowrap}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-size:13px;text-decoration:underline}
.tl li.undone .act{text-decoration:line-through;color:var(--muted)}
tr.open td{background:var(--sunk)}
.edit{background:var(--sunk);border-radius:8px;padding:10px;margin:4px 0 8px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1.2fr;gap:8px;align-items:end}
.steps td{padding:5px 4px} .steps select{min-width:70px} .steps input[type=text],.steps select,.steps input[type=date]{padding:5px 6px;font-size:14px}
.err{color:var(--red);font-size:13px}
label .muted{display:block}
@media (max-width:820px){.grid3{grid-template-columns:1fr}}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumb{position:relative}.thumb img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line, #ddd)}.thumb .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#333;color:#fff;cursor:pointer;line-height:22px;padding:0}.filebtn{cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand" id="brand"></div>
    <div class="roles" id="roles"></div>
    <span class="who-me" id="whome"></span>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs"></nav></div>
</header>
<main class="wrap" id="main"><div class="empty">加载中…</div></main>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="deadlines.js"></script>
<script src="store.js"></script>
<script>
/* ======================= 页面逻辑 =======================
   数据都在服务器上：页面启动时取一次，之后每个操作发给服务器，服务器写留痕后返回最新数据。
   规则（红黄绿灯、该不该催、逾期责任判断）在这里算，和演示版一致。 */
const CF = window.CFG;
let D = null, TODAY = "", S = null, SEEN = 0;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dt = s => new Date(s + "T00:00:00Z");
const diff = (a, b) => Math.round((dt(a) - dt(b)) / 864e5);
const addDays = (s, n) => new Date(dt(s).getTime() + n * 864e5).toISOString().slice(0, 10);
const md = s => (s || "").slice(5);
const stu = name => D.students.find(s => s.name === name) || {name, parent:"家长", consultant:""};
const itemById = id => D.items.find(i => i.id === String(id));
const isFam = it => it.owner === "家长" || it.owner === "学生";
const OWN = ["学生", "家长", "学校", "机构"];
const ownerSel = (v, attrs) => `<select ${attrs}>${OWN.map(o => `<option ${o === v ? "selected" : ""}>${o}</option>`).join("")}</select>`;
const short = name => name.length >= 3 ? name.slice(1) : name;   // 话术里称呼学生：三个字的名字去掉姓

/* 数据读写在 store.js（api、extract、boot） */

/* ---------- 状态 ---------- */
function blankAdd(){ return {school:"", round:"", deadline:"", reason:"", src:"", remember:true, croundIn:"", steps:[], key:""}; }
function blankRow(){ return {what:"", owner:"家长", due:""}; }
function fresh(){
  return { role: D.me.role === "owner" ? "o" : "c", tab:{c:"today", o:"board", s:"settings"}, pick:null, gen:null, undo:null, add:blankAdd(),
           filter:"全部", lf:{consultant:"全部", student:"全部"}, open:null, viewAs:null,
           cap:{student:null, text:"", imgs:[], busy:false, res:null, off:{}, offF:{}, rows:[blankRow()]}, newStu:false };
}

/* ---------- 规则 ---------- */
function light(it){ if (it.done) return "green"; const dd = diff(it.due, TODAY); return dd <= 3 ? "red" : dd <= 10 ? "yellow" : "green"; }
const overdue = it => !it.done && diff(it.due, TODAY) < 0;
function stages(it){ return CF.chaseDays.map(n => ({n, date:addDays(it.due, -n)})).filter(s => s.date > it.created); }
function chaseDue(it){
  if (it.done || !isFam(it) || overdue(it)) return -1;
  const reached = stages(it).filter(s => s.date <= TODAY);
  if (reached.length <= it.chases.length) return -1;
  return CF.chaseDays.indexOf(reached[reached.length-1].n);
}
function judge(it){
  const c = stu(it.student).consultant;
  if (it.owner === "机构") return {who:"机构", text:`卡在机构（${c}）`};
  if (it.owner === "学校") return {who:"学校", text:`卡在学校，机构已跟进 ${it.chases.length} 次`};
  const miss = [], exp = stages(it).length;
  if (!it.agreed) miss.push("没发约定");
  if (it.chases.length < exp) miss.push(`少催 ${exp - it.chases.length} 次`);
  if (miss.length) return {who:"机构", text:`机构有责任（${c}）：${miss.join("、")}`};
  return {who:it.owner, text:`卡在${it.owner}：约定已发${it.replied ? "、家长已回复" : ""}，按时催了 ${it.chases.length} 次`};
}
const rank = {red:0, yellow:1, green:2};
function summary(name){
  const open = D.items.filter(i => i.student === name && !i.done).sort((a,b) => rank[light(a)] - rank[light(b)] || diff(a.due, b.due));
  const w = open[0];
  if (!w) return {light:"green", text:"没有未完成的事", waiting:""};
  const od = overdue(w);
  return {light:light(w), item:w, waiting: od ? judge(w).who : w.owner, text: `${w.what}（${od ? "逾期 " + (-diff(w.due, TODAY)) + " 天" : md(w.due) + " 截止"}）`};
}

/* ---------- 留痕 ---------- */
const sortedLogs = f => D.logs.filter(f);   // 服务器已按时间倒序
const timeline = logs => logs.length ? `<ul class="tl">${logs.map(l => `<li class="${l.n > SEEN ? "fresh" : ""} ${l.undone ? "undone" : ""}"><div class="t">${md(l.date)} ${l.time} · ${esc(l.src)}${l.undone ? " · 已撤销" : ""}${l.n > SEEN ? ' · <b style="color:var(--accent)">刚刚</b>' : ""}</div><div><span class="who">${esc(l.who)}</span>${l._s && l.student ? `<span class="chip">${esc(l.student)}</span> ` : ""}<span class="act">${esc(l.act)}</span></div></li>`).join("")}</ul>` : `<div class="empty">没有记录。</div>`;

/* ---------- 文案 ---------- */
const fill = (t, it) => { const s = stu(it.student); return t.replaceAll("{家长}", s.parent).replaceAll("{学生}", short(it.student)).replaceAll("{事项}", it.what).replaceAll("{截止}", md(it.due)).replaceAll("{顾问}", s.consultant); };
function agreeMsg(name, its){
  const s = stu(name);
  const list = its.map((it, i) => `${i+1}. ${it.owner === "家长" ? "您" : short(name)}在 ${md(it.due)} 前：${it.what}`).join("\n");
  return CF.templates.agree.replace("{家长}", s.parent).replace("{列表}", list).replace("{顾问}", s.consultant);
}
function parts(name){
  const its = D.items.filter(i => i.student === name);
  return { done: its.filter(i => i.done && diff(TODAY, i.done) <= 7), open: its.filter(i => !i.done).sort((a,b) => diff(a.due, b.due)),
           need: its.filter(i => !i.done && i.owner === "家长") };
}
function progressMsg(name){
  const s = stu(name), p = parts(name), L = [`${s.parent}您好，${short(name)}目前的进度：`];
  if (p.done.length) L.push("近一周完成：" + p.done.map(i => `${i.what}（${md(i.done)}）`).join("；") + "。");
  const nx = p.open.filter(i => i.owner !== "家长");
  if (nx.length) L.push("接下来：" + nx.map(i => `${md(i.due)} 前${i.what}（${i.owner}）`).join("；") + "。");
  if (p.need.length) L.push("需要您做的：" + p.need.map(i => `${md(i.due)} 前${i.what}`).join("；") + "。");
  else L.push("目前没有需要您处理的事。");
  L.push(`有变化我随时告诉您。—— ${s.consultant}`);
  return L.join("\n");
}
function reportText(name){
  const p = parts(name), s = stu(name);
  return [`${name} · 申请进度周报（${md(addDays(TODAY,-6))} 至 ${md(TODAY)}）`, `负责顾问：${s.consultant}`, "",
    "需要您做：" + (p.need.length ? p.need.map(i => `${md(i.due)} 前${i.what}`).join("；") : "本周没有"), "",
    "本周完成：", ...(p.done.length ? p.done.map(i => "· " + i.what + "（" + md(i.done) + "）") : ["· 无"]), "",
    "接下来：", ...(p.open.length ? p.open.map(i => `· ${md(i.due)} ${i.what}（${i.owner}）`) : ["· 无"])].join("\n");
}

/* ---------- 日期库和"加一所学校" ---------- */
const DL = window.DEADLINES || {schools:{}, info:{}};
DL.info = DL.info || {};
const RNAME = {ED:"ED", EDII:"ED II", EA:"EA", EAII:"EA II", REA:"REA", RD:"RD"};
const rn = r => RNAME[r] || r;
const isRoll = d => d === "Rolling" || d === "";
function lookup(school){
  if (DL.schools[school]) return {rounds: DL.schools[school], kind: DL.info[school] ? "manual" : "commonapp"};
  if (D.memory[school]) return {rounds: D.memory[school].d, kind: "mem"};
  return null;
}
function srcText(school, round, kind){
  if (kind === "commonapp") return `${DL.source}（${DL.source_updated} 更新）`;
  if (kind === "manual") return `${DL.info[school].source}（${DL.info[school].verified_on} 核实）`;
  if (kind === "mem"){ const m = D.memory[school]; return `本机构 ${m.by} ${md(m.on)} 自填${m.src ? "，" + m.src : ""}`; }
  return "";
}
function addState(){      // 根据当前选择算出：学校截止日（预填值）、是否滚动录取、来源
  const a = S.add, hit = a.school ? lookup(a.school) : null;
  if (hit){
    const d = a.round ? hit.rounds[a.round] : undefined;
    return {hit, ready: d !== undefined, rolling: d !== undefined && isRoll(d), dbDate: d !== undefined && !isRoll(d) ? d : "", round: a.round};
  }
  return {hit:null, ready: !!a.croundIn, rolling: a.croundIn === "滚动录取", dbDate: "", round: a.croundIn};
}
function syncSteps(){     // 学校截止日变了：没被顾问改过的事项跟着重算
  const a = S.add, st = addState(), key = a.school + "|" + st.round;
  if (a.key !== key){
    a.key = key; a.deadline = st.dbDate; a.reason = "";
    a.steps = CF.backplan.map(b => ({on:true, what: b.what.replace("{学校}", a.school).replace("{轮次}", rn(st.round)), owner:b.owner, days:b.days, due:"", edited:false}));
  }
  a.steps.forEach(s => { if (!s.edited) s.due = a.deadline && s.days !== undefined ? addDays(a.deadline, -s.days) : s.due; });
}
function addSchoolCard(name){
  const a = S.add, st = addState(), mem = Object.keys(D.memory);
  if (st.ready) syncSteps();
  let body = "";
  if (st.hit){
    body += `<div class="pills" style="margin:10px 0 0">${Object.entries(st.hit.rounds).map(([r, d]) => `<button data-round="${esc(r)}" aria-pressed="${r === a.round}">${isRoll(d) ? (r === "滚动录取" ? "滚动录取" : esc(rn(r)) + " · 滚动录取") : esc(rn(r)) + " · " + d}</button>`).join("")}</div>`;
    const note = st.hit.kind === "manual" && a.round ? DL.info[a.school].notes[a.round] : "";
    if (note) body += `<div class="muted small" style="margin-top:6px">学校备注：${esc(note)}</div>`;
  } else if (a.school){
    body += `<div class="edit" style="margin-top:10px"><b>日期库里没有这所学校，请自己填</b>
      <div class="muted small">填一次就记住，以后本机构的顾问都能直接选。</div>
      <div class="grid3" style="margin-top:8px">
        <label><span class="muted small">轮次</span><input type="text" list="roundopts" data-k="croundIn" data-r value="${esc(a.croundIn)}" placeholder="比如 RD、第一批"></label>
        <datalist id="roundopts">${CF.roundOptions.map(r => `<option value="${esc(r)}">`).join("")}</datalist>
        <label><span class="muted small">来源（可不填）</span><input type="text" data-k="src" value="${esc(a.src)}" placeholder="官网链接或「学校代表邮件」"></label>
        <label class="small" style="align-self:center"><input type="checkbox" data-k="remember" ${a.remember ? "checked" : ""}> 记住这所学校</label></div></div>`;
  }
  if (st.ready){
    const changed = st.dbDate && a.deadline && a.deadline !== st.dbDate;
    body += `<div class="edit" style="margin-top:10px">
      <div class="grid3"><label><span class="muted small">${st.rolling ? "滚动录取：和学生商定的计划递交日" : "学校截止日（专业截止更早的，直接改成专业的日期）"}</span>
        <input type="date" data-k="deadline" data-r value="${esc(a.deadline)}"></label>
        ${changed ? `<label style="grid-column:span 2"><span class="muted small">为什么改（会记进留痕）</span><input type="text" data-k="reason" value="${esc(a.reason)}" placeholder="比如：经济学专业 12-01 截止"></label>` : ""}</div>

const viewer = () => D.me.role === "owner" ? S.viewAs : D.me.id;          // 老板可以"以某位顾问的身份看"，空 = 看全部
const myStudents = () => D.students.filter(s => !viewer() ? true : s.consultant_id === viewer());
const mine = () => { const names = new Set(myStudents().map(s => s.name)); return D.items.filter(i => names.has(i.student)); };
function todayLists(){
  const m = mine(), unagreed = {};
  m.filter(it => isFam(it) && !it.agreed && !it.done && !overdue(it)).forEach(it => (unagreed[it.student] ??= []).push(it));
  return { chase: m.filter(it => chaseDue(it) >= 0 && it.agreed), unagreed,
           own: m.filter(it => !isFam(it) && !it.done && diff(it.due, TODAY) <= 3 && !overdue(it)),
           over: m.filter(overdue) };
}
const todayCount = () => { const t = todayLists(); return t.chase.length + Object.keys(t.unagreed).length + t.own.length; };

  const owner = D.me.role === "owner";
  return `<div class="two"><div>
    <div class="card"><div class="head"><b>我的称呼</b><span class="muted small">显示在留痕里</span></div>
      <div class="grid3"><input type="text" id="my_name" value="${esc(D.me.name)}"><span></span><button class="btn" data-act="myname">保存</button></div></div>
    ${owner ? `<div class="card"><div class="head"><b>机构名称</b></div>
      <div class="grid3"><input type="text" id="ag_name" value="${esc(D.agency)}"><span></span><button class="btn" data-act="agencyname">保存</button></div></div>` : ""}
    <div class="card"><div class="head"><b>学生</b><span class="muted small">结案后不再显示，记录保留</span></div>
      <table>${D.students.filter(s => owner || s.consultant_id === D.me.id).map(s => `<tr><td>${esc(s.name)}</td><td class="muted">${esc(s.parent)}</td><td class="muted">${esc(s.consultant)}</td><td><button class="linkbtn" data-act="archive" data-sid="${esc(s.id)}">结案</button></td></tr>`).join("") || `<tr><td class="muted">没有。</td></tr>`}</table></div></div>
  <div><div class="card"><div class="head"><b>成员</b><span class="muted small">用 Claude 账号登录，不用另设密码</span></div>
      <table><tr><th>称呼</th><th>角色</th><th></th></tr>${D.users.map(u => `<tr><td>${esc(u.name)}${u.id === D.me.id ? "（我）" : ""}</td><td>${u.role === "owner" ? "老板" : "顾问"}</td>
        <td class="nw">${owner && u.id !== D.me.id ? `<button class="linkbtn" data-act="setrole" data-uid="${esc(u.id)}" data-role="${u.role === "owner" ? "consultant" : "owner"}">设为${u.role === "owner" ? "顾问" : "老板"}</button>` : ""}</td></tr>`).join("")}</table>
      <div class="muted small" style="margin-top:8px">加同事：在页面右上角的分享里把同事加为"可编辑"（Contributor）。同事第一次打开时填自己的称呼，就会出现在这里。</div></div>
    <div class="card"><div class="head"><b>数据</b></div><div class="muted small">只存学生称呼、家长称呼、事项和进度，不存身份证、成绩单、聊天原文。AI 整理时，粘贴的原文交给 Claude 整理，整理完不保存。</div></div></div></div>`;
}};

/* 语音输入：说一段见面笔记，转成文字放进录入框 */
let MIC_ON = false;
function mic(btn){
  if (!DICT) return toast("这个浏览器不支持语音输入");
  if (MIC_ON){ DICT.stop().catch(() => {}); return; }
  const ta = document.querySelector('[data-k2="text"]'), base = ta ? ta.value : S.cap.text;
  let finals = "";
  DICT.onFinal(({text}) => { finals += text; S.cap.text = base + finals; const t = document.querySelector('[data-k2="text"]'); if (t) t.value = S.cap.text; });
  DICT.onPartial(({text}) => { const t = document.querySelector('[data-k2="text"]'); if (t) t.value = base + finals + text; });
  DICT.onState(({state}) => { MIC_ON = state === "listening"; const b = document.getElementById("micbtn"); if (b) b.textContent = MIC_ON ? "停止说话" : "说一段"; });
  DICT.start().catch(e => toast(e && e.code === "not_granted" ? "没有允许使用麦克风" : "语音输入没启动，请再点一次"));
}

/* ---------- 渲染 ---------- */
const TABS = { c:[["today","今天"],["capture","录入"],["student","学生"]], o:[["board","看板"],["trail","留痕"]], s:[["settings","设置"]] };
function render(){
  document.getElementById("brand").innerHTML = `${esc(CF.product)}<small>${esc(D.agency)} · 今天 ${esc(TODAY)}</small>`;
  const roles = D.me.role === "owner" ? [["o","老板端"],["c","顾问端"],["s","设置"]] : [["c","顾问端"],["s","设置"]];
  document.getElementById("roles").innerHTML = roles.map(([k, l]) => `<button data-role="${k}" aria-pressed="${S.role === k}">${l}</button>`).join("");
  document.getElementById("whome").textContent = D.me.name;
  const tab = S.tab[S.role], n = todayCount();
  document.getElementById("tabs").innerHTML = TABS[S.role].length > 1 ? TABS[S.role].map(([id, label]) => `<button data-tab="${id}" ${id === tab ? 'aria-current="page"' : ""}>${label}${id === "today" && n ? `<span class="n">${n}</span>` : ""}</button>`).join("") : "";
  const undo = S.undo ? `<div class="card" style="background:var(--green-bg);border-color:transparent;box-shadow:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span>已记下：${esc(S.undo.label)}</span><button class="btn ghost" data-act="undo" style="padding:4px 12px">撤销</button></div>` : "";
  const asBar = S.role === "c" && D.me.role === "owner" ? `<div class="pills"><span class="muted small" style="align-self:center">以谁的身份看：</span>${[["", "全部学生"], ...D.users.filter(u => u.active && D.students.some(s => s.consultant_id === u.id)).map(u => [u.id, u.name])].map(([id, n]) => `<button data-viewas="${esc(id)}" aria-pressed="${(S.viewAs || "") === id}">${esc(n)}</button>`).join("")}${S.viewAs ? '<span class="muted small" style="align-self:center">这是该顾问看到的界面；你在这里的操作仍记在你名下</span>' : ""}</div>` : "";
  document.getElementById("main").innerHTML = undo + asBar + ({c:C, o:O, s:SET}[S.role])[tab]();
}
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => el.hidden = true, 2600); }
async function copy(text){
  try { await navigator.clipboard.writeText(text); toast("已复制，去微信粘贴"); }
  catch(e){ const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch(_){} ta.remove(); toast(ok ? "已复制，去微信粘贴" : "复制失败，请长按文字手动复制"); }
}
const val = id => (document.getElementById(id) || {}).value || "";

/* ---------- 事件 ---------- */
async function act(name, ds, el){
  const it = ds.id ? itemById(ds.id) : null;
  switch (name){
    case "copy": { const ta = el.closest(".card").querySelector("textarea"); copy(ta.value);
      if (ds.then === "chased") return api("chased", {item: it.id}, `${it.student} 的催办`);
      if (ds.then === "agreed") return api("agreed", {student: stu(ds.s).id}, `${ds.s} 的约定`);
      if (ds.then === "sent") return api("sent", {student: stu(ds.s).id, what: ds.what}, `${ds.s} 的${ds.what}`);
      return; }
    case "undo": await api("undo", {log: S.undo.log}); toast("已撤销，留痕里会标出"); return;
    case "chased": return api("chased", {item: it.id}, `跟进 ${it.what}`);
    case "done": S.open = null; await api("done", {item: it.id}, `${it.what} 已完成`); return toast("已完成，催办停止");
    case "replied": { const t = prompt("家长回复的原话（可不填）：", "收到"); if (t === null) return;
      return api("replied", {item: it.id, text: t}, `${it.student} 家长已回复`); }
    case "openitem": if (it && S.tab[S.role] !== "student"){ S.tab[S.role] = "student"; S.pick = it.student; S.gen = null; S.add = blankAdd(); S.open = it.id; render();   // 从「今天」点进来：跳到这个学生，展开这一行
        const tr = document.querySelector("tr.open"); if (tr) tr.scrollIntoView({block: "center"}); return; }
      S.open = S.open === ds.id || !ds.id ? null : ds.id; return render();
    case "editdue": { const due = val("ed_due"), reason = val("ed_reason").trim();
      S.open = null; await api("editdue", {item: it.id, due, reason}, `${it.what} 改截止日`); return toast("已改，留痕里有记录"); }
    case "deleteitem": { const reason = prompt(`删除「${it.what}」？请写一下原因（会记进留痕）：`); if (reason === null) return;
      S.open = null; return api("deleteitem", {item: it.id, reason}, `删除 ${it.what}`); }
    case "gen": S.gen = {student: S.pick, k: ds.k}; return render();
    case "togglenew": S.newStu = !S.newStu; return render();
    case "addstudent": { const body = {name: val("ns_name").trim(), parent: val("ns_parent").trim()};
      if (D.me.role === "owner") body.consultant = val("ns_cons");
      await api("addstudent", body); S.newStu = false; S.pick = body.name; render(); return toast("已添加"); }
    case "addstep": S.add.steps.push({on:true, what:"", owner:"机构", due:S.add.deadline, edited:true}); return render();
    case "addschool": { const a = S.add, st = addState(), steps = a.steps.filter(s => s.on);
      if (steps.some(s => !s.what.trim() || !s.due)) return toast("勾选的事项都要填内容和日期");
      await api("addschool", {student: stu(ds.s).id, school: a.school, round: st.round, deadline: a.deadline, db_deadline: st.dbDate || null,
        rolling: st.rolling, reason: a.reason, source: st.hit ? srcText(a.school, a.round, st.hit.kind) : a.src, remember: !st.hit && a.remember,
        steps: steps.map(s => ({what: s.what.trim(), owner: s.owner, due: s.due, edited: s.edited}))}, `${a.school} 的 ${steps.length} 条事项`);
      S.add = blankAdd(); render(); return toast(`已写入 ${steps.length} 条事项`); }
    case "forget": if (!confirm(`删除本机构记住的 ${S.add.school} 的日期？`)) return;
      await api("forget", {school: S.add.school}); S.add = {...blankAdd(), school: S.add.school}; return render();
    case "organize": { const cp = S.cap; if (!cp.text.trim() && !cp.imgs.length) return toast("先贴一段文字或加一张图片");
      cp.busy = true; cp.res = null; render();
      try { cp.res = await extract(stu(cp.student).id, cp.text, cp.imgs.map(m => m.blob)); cp.off = {}; cp.offF = {}; }
      finally { cp.busy = false; render(); } return; }
    case "clearcap": S.cap.res = null; return render();
    case "confirmcap": { const cp = S.cap, r = cp.res, sid = stu(cp.student).id;
      const on = r.newItems.filter((u, i) => !cp.off[i]), fd = r.found.filter((u, i) => !cp.offF[i]);
      if (on.some(u => !u.due || !u.what.trim())) return toast("每条事项都要有截止日");
      if (on.length) await api("additems", {student: sid, items: on, from: cp.imgs.length ? "AI 整理笔记/聊天/图片" : "AI 整理笔记/聊天"}, `${on.length} 条事项`);
      if (fd.length) await api("found", {student: sid, found: fd});
      cp.res = null; cp.text = ""; cp.imgs = []; render(); return toast("已写入"); }
    case "rmimg": S.cap.imgs.splice(+ds.i, 1); return render();
    case "addrow": S.cap.rows.push(blankRow()); return render();
    case "manualadd": { const rows = S.cap.rows.filter(r => r.what.trim() || r.due);
      if (!rows.length) return toast("先填一条");
      if (rows.some(r => !r.what.trim() || !r.due)) return toast("每行都要填事项和日期");
      await api("additems", {student: stu(S.cap.student).id, items: rows, from: "手动添加"}, `${rows.length} 条事项`);
      S.cap.rows = [blankRow()]; render(); return toast("已写入"); }
    case "myname": await api("myname", {name: val("my_name")}); return toast("已保存");
    case "agencyname": await api("agency", {name: val("ag_name")}); return toast("已保存");
    case "setrole": return api("setrole", {user: ds.uid, role: ds.role});
    case "mic": return mic(el);
    case "exportitems": { const rows = [["学生","事项","负责","截止","录入","约定","家长回复","催办次数","完成","学校"], ...D.items.map(i => [i.student, i.what, i.owner, i.due, i.created, i.agreed || "", i.replied || "", i.chases.length, i.done || "", i.school || ""])];
      return copy(rows.map(r => r.join("\t")).join("\n")); }
    case "archive": if (!confirm("结案后这个学生不再显示（记录保留）。确定？")) return; return api("archivestudent", {student: ds.sid});
  }
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act],[data-role],[data-tab],[data-pick],[data-opick],[data-filter],[data-round],[data-memschool],[data-capstu],[data-viewas]"); if (!el) return;
  if (el.tagName === "TR" && e.target.closest("button,a,input,select")) return;
  const ds = el.dataset;
  if (ds.role){ S.role = ds.role; S.undo = null; return render(); }
  if (ds.viewas !== undefined){ S.viewAs = ds.viewas || null; S.pick = null; S.cap.student = null; S.add = blankAdd(); return render(); }
  if (ds.tab){ S.tab[S.role] = ds.tab; return render(); }
  if (ds.pick){ S.pick = ds.pick; S.gen = null; S.open = null; S.add = blankAdd(); return render(); }
  if (ds.capstu){ S.cap = {...S.cap, student: ds.capstu, res:null, text:"", imgs:[]}; return render(); }
  if (ds.filter){ S.filter = ds.filter; return render(); }
  if (ds.round){ S.add.round = ds.round; S.add.key = ""; return render(); }
  if (ds.memschool){ S.add = {...blankAdd(), school: ds.memschool}; return render(); }
  if (ds.opick){ S.lf = {consultant:"全部", student:ds.opick}; S.tab.o = "trail"; render(); return window.scrollTo({top:0}); }
  el.disabled = true;
  Promise.resolve(act(ds.act, ds, el)).catch(() => {}).finally(() => { if (el.isConnected) el.disabled = false; });
});
/* 图片：缩到长边 1600 像素再交给 AI，只在内存里，不保存 */
async function shrink(file){
  const bmp = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const url = c.toDataURL("image/jpeg", 0.85), blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
  return {url, blob};
}
async function addImgs(files){
  files = files.filter(f => f && /^image\//.test(f.type));
  if (!files.length) return;
  const room = 4 - S.cap.imgs.length;
  if (room <= 0) return toast("一次最多 4 张图片");
  if (files.length > room) toast("一次最多 4 张图片，多的没加");
  const ta = document.querySelector('[data-k2="text"]'); if (ta) S.cap.text = ta.value;
  try { for (const f of files.slice(0, room)) S.cap.imgs.push(await shrink(f)); }
  catch (e){ toast("这张图片打不开，换一张试试"); }
  render();
}
document.addEventListener("change", e => { if (e.target.matches("[data-capimg]")){ addImgs([...e.target.files]); e.target.value = ""; } });
document.addEventListener("paste", e => {
  if (!D || !D.aiImages || !e.target.closest('[data-k2="text"]')) return;
  const files = [...(e.clipboardData ? e.clipboardData.items : [])].filter(i => i.kind === "file" && i.type.startsWith("image/")).map(i => i.getAsFile());
  if (files.length){ e.preventDefault(); addImgs(files); }
});
function onField(e, final){
  const t = e.target, ds = t.dataset, v = t.type === "checkbox" ? t.checked : t.value;
  if (ds.k !== undefined){ S.add[ds.k] = typeof v === "string" && t.type !== "date" ? v.trim() : v;
    if (ds.k === "deadline" || ds.k === "croundIn") S.add.key = ds.k === "croundIn" ? "" : S.add.key;
    if (final && ds.r !== undefined) render(); return; }
  if (ds.step !== undefined){ const s = S.add.steps[+ds.step]; s[ds.f] = v; if (ds.f === "due") s.edited = true; if (final && (ds.f === "due" || ds.f === "on")) render(); return; }
  if (ds.res !== undefined){ S.cap.res.newItems[+ds.res][ds.f] = v; return; }
  if (ds.row !== undefined){ S.cap.rows[+ds.row][ds.f] = v; return; }
  if (ds.k2 !== undefined){ S.cap[ds.k2] = v; return; }
  if (!final) return;
  if (ds.upd !== undefined){ S.cap.off[ds.upd] = !t.checked; render(); }
  if (ds.updf !== undefined){ S.cap.offF[ds.updf] = !t.checked; render(); }
  if (t.id === "school"){ S.add = {...blankAdd(), school: t.value.trim()}; render(); }
  if (ds.lf){ S.lf[ds.lf] = t.value; if (ds.lf === "consultant") S.lf.student = "全部"; render(); }
}
document.addEventListener("input", e => onField(e, false));
document.addEventListener("change", e => onField(e, true));

boot();
</script>

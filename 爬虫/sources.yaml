# 数据来源配置。加学校、加网页都改这个文件，不用改 crawler.py。
#
# type: commonapp_grid  自动解析 Common App 要求总表 PDF（美国学校）
# type: watch           监控官网页面上的日期有没有变化，变了就在 changes.md 里提醒人工核实，
#                       然后去改 manual_deadlines.csv（英国、香港、澳洲的日期都在那个表里）

sources:
  - name: Common App 要求总表
    type: commonapp_grid
    url: https://content.commonapp.org/Files/ReqGrid.pdf

  # ---------- 英国（前 10 所都走 UCAS，日期统一） ----------
  # UCAS 的总览页日期要靠网页脚本加载，程序读不到，所以改盯 UCAS 的截止日事件页和帝国理工的截止日页（都是直接写在页面里的）。
  - {name: UCAS 1 月截止日, type: watch, url: "https://www.ucas.com/events/2027-entry-deadline-for-all-undergraduate-courses-except-those-with-a-15-october-deadline-475546"}
  - {name: 帝国理工截止日页（UCAS 日期参照）, type: watch, url: "https://imperial.ac.uk/study/apply/undergraduate/process/deadlines/"}

  # ---------- 香港 ----------
  - {name: 香港大学 HKU, type: watch, url: "https://admissions.hku.hk/sites/default/files/2026-09/HKU_General_Information_NJ_2027.pdf"}
  - {name: 香港中文大学 CUHK, type: watch, url: "https://admission.cuhk.edu.hk/application/overseas-other-qualifications-non-local-international-team/application-guides/"}
  - {name: 香港科技大学 HKUST, type: watch, url: "https://join.hkust.edu.hk/node/7"}
  - {name: 香港理工大学 PolyU, type: watch, url: "https://www.polyu.edu.hk/saso/docdrive/Public/AdmissionLeaflets/infosheet_non_jupas_2027.pdf"}
  - {name: 香港城市大学 CityU, type: watch, url: "https://www.cityu.edu.hk//admo/news/2027_Flyer_Non-JUPAS_Admission.pdf"}
  - {name: 香港浸会大学 HKBU, type: watch, url: "https://admissions.hkbu.edu.hk/ug/intl_prospectus"}
  - {name: 岭南大学 Lingnan, type: watch, url: "https://ln.edu.hk/admissions/ug/overseas/apply/admission-requirements"}
  - {name: 香港教育大学 EdUHK, type: watch, url: "https://www.apply.eduhk.hk/ug/nonlocal_dates"}
  # 香港都会大学、香港恒生大学：2027 非本地生的日期页面还没找到，找到后照上面的格式加一行。

  # ---------- 澳洲八校 ----------
  - {name: University of Sydney, type: watch, url: "https://www.sydney.edu.au/study/how-to-apply/application-dates.html"}
  - {name: UNSW Sydney, type: watch, url: "https://unsw.edu.au/study/international-students/admissions-info"}
  - {name: Australian National University, type: watch, url: "https://study.anu.edu.au/apply/international-applications"}
  - {name: University of Queensland, type: watch, url: "https://study.uq.edu.au/admissions/undergraduate/submit-your-application"}
  - {name: University of Western Australia, type: watch, url: "https://www.uwa.edu.au/study/How-to-apply/Undergraduate-international"}
  # 下面三所官网没有统一的 2027 截止日（墨尔本页面还停在 2025，Monash 全年可申请，Adelaide 按专业列），只监控页面：
  - {name: University of Melbourne, type: watch, url: "https://study.unimelb.edu.au/how-to-apply/undergraduate-study/international-applications/entry-requirements/important-dates"}
  - {name: Monash University, type: watch, url: "https://www.monash.edu/admissions/apply/international-ug"}
  - {name: Adelaide University, type: watch, url: "https://adelaide.edu.au/study/international-students/how-to-apply/"}
